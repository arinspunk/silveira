schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Write all artifacts (proposal, design, specs, tasks) in English; requirement and scenario names in specs are in English too. Changes archived before this rule (openspec/changes/archive/) stay in Spanish as history.
  The site's visible text and the admin labels are in galego reintegrado, "umha"/"-çom"/"nom" variant, always through gettext with the `silveira` text domain. When an artifact quotes that text (e.g. a button label in a scenario), quote it as it appears on the site. The linguistic review happens later and does not block any change.
  The team has no PHP on the host: PHP commands (composer, PHPCS, PHPStan) run with Docker (`composer:2`) and WP-CLI with `docker compose --profile tools run --rm wpcli`.
  `wp-content/themes/silveira/assets/` is versioned because the production server has no Node. The pre-commit hook rebuilds it and CI checks that it matches `src/`; changes don't need their own build tasks.
  Apply changes one at a time and in order, merging each one before starting the next, to avoid conflicts in `assets/`.
  If a change modifies the markup or behaviour of the map or the front page, it must include a task to keep the Playwright smoke test (`tests/e2e/`) up to date.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
