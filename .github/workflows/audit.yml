name: Audit

# Weekly composer audit: catches published security advisories even when nobody opens a PR.
# GitHub sends an email if it fails. Same command as the step in the php job in ci.yml.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: composer-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/silveira
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress
      - run: composer audit --locked --abandoned=report --no-interaction
