name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/silveira
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: wp-content/themes/silveira/package-lock.json

      - run: npm ci
      - run: npm run validate
      - run: npm run format:check
      - run: npm run build

      - name: assets/ coincide con src/
        run: |
          if ! git diff --exit-code --stat -- assets/ || [ -n "$(git status --porcelain -- assets/)" ]; then
            git status --porcelain -- assets/
            echo "::error::assets/ no coincide con src/. Ejecuta 'npm run build' en wp-content/themes/silveira y commitea assets/ (el hook pre-commit lo hace solo si está instalado: 'npm install' en la raíz)."
            exit 1
          fi

      - name: Subir assets/ generados (diagnóstico)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assets-ci
          path: wp-content/themes/silveira/assets/
          retention-days: 7

  php:
    name: php
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/silveira
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Avisos de seguridad en dependencias PHP
        run: composer audit --locked --abandoned=report --no-interaction

      - run: composer run lint
      - run: composer run analyse -- --no-progress

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Levantar WordPress aislado (puerto 8081, assets compilados)
        run: npm run e2e:up

      - name: Sembrar datos de prueba
        run: npm run e2e:seed

      # Tests run in the official Playwright image (browser and system dependencies
      # included): no apt or `playwright install`. The tag comes from package.json.
      - name: Versión de Playwright (package.json)
        run: |
          PW_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          if ! [[ "$PW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test debe estar fijado a una versión exacta X.Y.Z en package.json (ahora: '$PW_VERSION'); la imagen mcr.microsoft.com/playwright se elige con esa versión."
            exit 1
          fi
          echo "PW_IMAGE=mcr.microsoft.com/playwright:v$PW_VERSION-noble" >> "$GITHUB_ENV"
          echo "PW_VERSION=$PW_VERSION" >> "$GITHUB_ENV"

      - name: Descargar imagen de Playwright
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            if timeout 150 docker pull -q "$PW_IMAGE"; then exit 0; fi
            echo "Intento $i de descargar $PW_IMAGE fallido."
            [ "$i" -lt 3 ] && sleep 15
          done
          echo "::error::No se pudo descargar $PW_IMAGE de mcr.microsoft.com tras 3 intentos. Es un fallo de infraestructura, no de los tests: relanza el job más tarde."
          exit 1

      - name: Tests E2E (Playwright en Docker)
        run: |
          docker run --rm --network host --ipc host \
            -v "$PWD":/work -w /work -e CI=true \
            "$PW_IMAGE" \
            sh -c 'echo "Node $(node --version) en la imagen" && npx playwright --version && npx playwright test'

      - name: Subir informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Logs de WordPress
        if: failure()
        run: docker compose -p silveira-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs wordpress --tail 200
