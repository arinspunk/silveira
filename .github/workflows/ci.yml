name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/silveira
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: wp-content/themes/silveira/package-lock.json

      - run: npm ci
      - run: npm run validate
      - run: npm run format:check
      - run: npm run build

      - name: assets/ matches src/
        run: |
          if ! git diff --exit-code --stat -- assets/ || [ -n "$(git status --porcelain -- assets/)" ]; then
            git status --porcelain -- assets/
            echo "::error::assets/ does not match src/. Run 'npm run build' in wp-content/themes/silveira and commit assets/ (the pre-commit hook does it for you if it is installed: 'npm install' at the repo root)."
            exit 1
          fi

      - name: Upload generated assets/ (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assets-ci
          path: wp-content/themes/silveira/assets/
          retention-days: 7

  php:
    name: php
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/silveira
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Security advisories in PHP dependencies
        run: composer audit --locked --abandoned=report --no-interaction

      - run: composer run lint
      - run: composer run analyse -- --no-progress

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Start isolated WordPress (port 8081, built assets)
        run: npm run e2e:up

      - name: Seed test data
        run: npm run e2e:seed

      # Tests run in the official Playwright image (browser and system dependencies
      # included): no apt or `playwright install`. The tag comes from package.json.
      - name: Playwright version (package.json)
        run: |
          PW_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          if ! [[ "$PW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test must be pinned to an exact X.Y.Z version in package.json (currently: '$PW_VERSION'); the mcr.microsoft.com/playwright image is chosen from that version."
            exit 1
          fi
          echo "PW_IMAGE=mcr.microsoft.com/playwright:v$PW_VERSION-noble" >> "$GITHUB_ENV"
          echo "PW_VERSION=$PW_VERSION" >> "$GITHUB_ENV"

      - name: Pull Playwright image
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            if timeout 150 docker pull -q "$PW_IMAGE"; then exit 0; fi
            echo "Attempt $i to pull $PW_IMAGE failed."
            [ "$i" -lt 3 ] && sleep 15
          done
          echo "::error::Could not pull $PW_IMAGE from mcr.microsoft.com after 3 attempts. This is an infrastructure failure, not a test failure: re-run the job later."
          exit 1

      - name: E2E tests (Playwright in Docker)
        run: |
          docker run --rm --network host --ipc host \
            -v "$PWD":/work -w /work -e CI=true \
            "$PW_IMAGE" \
            sh -c 'echo "Node $(node --version) in the image" && npx playwright --version && npx playwright test'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: WordPress logs
        if: failure()
        run: docker compose -p silveira-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs wordpress --tail 200
