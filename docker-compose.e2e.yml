# Isolated environment for the E2E smoke test (Playwright).
# Usage: docker compose -p silveira-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
# Its own volumes (silveira-e2e project), port 8081 and built assets (no Vite dev).

services:
  wordpress:
    ports: !override
      - "8081:80"
    environment:
      SILVEIRA_VITE_DEV: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8081');
        define('WP_SITEURL', 'http://localhost:8081');

  wpcli:
    environment:
      SILVEIRA_VITE_DEV: "0"
